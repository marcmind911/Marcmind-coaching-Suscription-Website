{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | MarcMind</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #002829,
                    #004d4e
                );

            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #d9a52e;

            color: #002829;

            font-size: 25px;
            font-weight: 800;
        }

        h1 {
            text-align: center;

            color: #002829;

            font-size: 27px;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #718080;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #173d3e;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #dce4e3;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition: .2s;
        }

        input:focus {
            border-color: #d9a52e;

            box-shadow:
                0 0 0 3px rgba(217,165,46,.12);
        }

        button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #d9a52e;

            color: #002829;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: .25s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(217,165,46,.25);
        }

        .back-login {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #006566;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="logo">
        <div class="logo-icon">
            M
        </div>
    </div>

    <h1>Reset Your Password</h1>

    <p class="description">
        Enter the email address associated with your account.
        We'll send you a secure link to create a new password.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a href="{% url 'login' %}" class="back-login">
        ← Back to Login
    </a>

</div>

</body>
</html>
