<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Create New Password</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #002829,
                #00595a
            );

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow: 0 25px 70px rgba(0,0,0,.25);
        }

        h1 {
            color: #002829;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #718080;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;

            color: #173d3e;

            font-weight: bold;

            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: #d9a52e;

            color: #002829;

            font-weight: bold;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    {% if validlink %}

        <h1>Create New Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>

        </form>

    {% else %}

        <h1>Invalid Link</h1>

        <p>
            This password reset link is invalid or has expired.
            Please request a new password reset link.
        </p>

    {% endif %}

</div>

</body>
</html>
