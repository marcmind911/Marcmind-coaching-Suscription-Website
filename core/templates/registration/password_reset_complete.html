<!DOCTYPE html>
<html>
<head>
    <title>Password Changed</title>

    <style>
        body {
            font-family: Arial;
            background: #002829;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;

            padding: 45px;

            border-radius: 20px;

            text-align: center;

            max-width: 420px;
        }

        .success {
            font-size: 50px;
        }

        h1 {
            color: #002829;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 13px 25px;

            border-radius: 9px;

            background: #d9a52e;

            color: #002829;

            text-decoration: none;

            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="success">✓</div>

    <h1>Password Changed</h1>

    <p>
        Your password has been successfully changed.
        You can now log in with your new password.
    </p>

    <a href="{% url 'login' %}">
        Login Now
    </a>

</div>

</body>
</html>
